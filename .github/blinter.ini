# The Blinter settings of .github/workflows/script-security.yml: findings
# of the Error, Security and Warning severities, from every rule the list
# below does not disable. Each such finding fails the job unless the
# baseline accepts it. The workflow's header says what reads this file.
[general]
min_severity = WARNING
fail_on = warning

# Warning rules whose findings are neither fixed nor accepted yet (#729).
# A rule leaves this list in the change that fixes or accepts its findings.
[rules]
disabled_rules = W002,W003,W005,W007,W009,W011,W014,W023,W025,W039,W040
