# The Blinter settings of .github/workflows/script-security.yml: findings
# of every rule at every severity, except the rules the batch style
# declines, which CONTRIBUTING.md's last section lists with its reasons.
# Each such finding fails the job unless the baseline accepts it. The
# workflow's header says what reads this file.
[general]
min_severity = STYLE
fail_on = style
max_line_length = 100

[rules]
disabled_rules = S007,S008,S019,P001,P012,P016,P017,P019,P022,P023,P024
