---
# one ecosystem, because one is what this tree has. There is no manifest
# and no lock file -- `git ls-files 'pyproject.toml' 'uv.lock' 'Gemfile'`
# is empty -- so the actions the workflows pin are the whole of what
# dependabot can see here, and the binaries the update scripts install
# are pinned by `keys/*.fingerprints` and verified by PGP rather than
# resolved by anybody's resolver.
#
# The pre-commit hook revisions are the other thing this repository pins
# and are not below: dependabot has no pre-commit ecosystem, and the
# `ci:` block of .pre-commit-config.yaml has pre-commit.ci bumping them
# weekly instead.
#
# Grouped, so an update week is one pull request rather than one per
# action: every one of them runs the lint gate, and reading a group is
# the same reading as one entry plus a diff.
#
# No target-branch: without one dependabot opens against the default
# branch, which is the only branch a change lands on -- and a
# target-branch naming a branch that is not there is not an error
# anywhere, it is a repository where nothing is ever proposed.
#
# The seven-day cooldown is what the weekly interval is meant to
# trade against: a compromised release is usually yanked within days,
# and `default-days` is the cooldown parameter GitHub's own reference
# lists as supported for the github-actions ecosystem. This repository
# has seen it miss: PR 331 offered v1.0.208 five days twelve hours
# after that release published, with default-days: 7 already in
# force. Whether the cooldown was applied and lost, or never reached
# this pin's shape, is not settled here; dependabot/dependabot-core
# #15505 reports the same ecosystem, the same commit-pinned shape
# and the same symptom, and is open
version: 2
updates:
  # every action in .github/workflows is pinned to a commit SHA, and
  # nothing but this moves one: without it a pin is frozen for good, and
  # a fix -- or an advisory -- upstream never reaches this repository
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Thursday, which is the day section 10 of btclib-org/.github's
      # README.md gives dependabot across the organization. Actions move
      # rarely, so a week where none did opens no pull request at all
      day: thursday
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
