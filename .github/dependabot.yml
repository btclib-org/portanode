---
# one ecosystem, because one is what this tree configures. There is no
# manifest and no lock file -- `git ls-files 'pyproject.toml' 'uv.lock'
# 'Gemfile'` is empty -- so the actions the workflows pin are the whole
# of what this file points dependabot at, and the binaries the update
# scripts install are pinned by `keys/*.fingerprints` and verified by
# PGP rather than resolved by anybody's resolver.
#
# The pre-commit hook revisions are the other thing this repository pins
# and are not below: dependabot's `pre-commit` ecosystem exists but is
# not configured here, and the `ci:` block of .pre-commit-config.yaml
# has pre-commit.ci bumping `rev:` lines weekly instead.
#
# Grouped, so an update week is one pull request rather than one per
# action: every one of them runs the lint gate, and reading a group is
# the same reading as one entry plus a diff.
#
# No target-branch: without one dependabot opens against the default
# branch, which is the only branch a change lands on -- and a
# target-branch naming a branch that is not there is not an error
# anywhere, it is a repository where nothing is ever proposed.
#
# The seven-day cooldown is what the weekly interval is meant to trade
# against: a compromised release is usually yanked within days, and
# `default-days` is the cooldown parameter GitHub's own reference
# lists as supported for the github-actions ecosystem. It is applied
# and it filters: PR 331 offered v1.0.208 while holding v1.0.209
# through v1.0.214, the newest of them then available, and PR 510
# offered v1.0.211 while holding v1.0.212 through v1.0.217, again the
# newest then available. The boundary needs no assumption about when
# the check ran: PR 331's offer sat two hours thirty-seven minutes
# short of its first held release, PR 510's twenty-two hours six
# minutes short of its own -- both short of a full day. Two points do
# not distinguish a date rather than a time-of-day comparison from a
# scheduler that rounds. They do rule out the reused-Release path
# `dependabot/dependabot-core#15505` names: its own symptom is the
# newest release taken outright, which neither instance did, and no
# release either touched carries its reuse signature -- v1.0.207, 208,
# 211, 214 and 217 were each created within four seconds of their own
# publish, where the reused `v1` alias's own `created_at` trails its
# `published_at` by 375 days. A third instance, or reading the
# grouped-update path both pull requests took, is what would settle
# the pair that remains
version: 2
updates:
  # every action in .github/workflows is pinned to a commit SHA, and
  # nothing but this moves one: without it a pin is frozen for good, and
  # a fix -- or an advisory -- upstream never reaches this repository
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Thursday, which is the day section 10 of btclib-org/.github's
      # README.md gives dependabot across the organization. Actions move
      # rarely, so a week where none did opens no pull request at all
      day: thursday
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
