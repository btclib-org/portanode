---
name: os-windows

# the Windows part of the platform sweep: the suite under tests/, under
# PowerShell 7 and Windows PowerShell 5.1, which win/scripts/root.ps1 says
# differ in how they run a script by its path. The gate, tests.yml, runs one
# image for the reason its header gives; this answers weekly, and before a
# release, where RELEASING.md dispatches it. It gates no merge.

on:
  schedule:
    # the instant is section 10's calendar in btclib-org/.github, the day
    # and the hour the workflow's and the minute this repository's, and not
    # this file's to restate
    - cron: "28 5 * * 5"
  # the only way to ask about a branch, and how a release asks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Run the suite on Windows (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # started from pwsh, a step's shell taking no expression
      - name: Run the suite
        shell: pwsh
        env:
          POWERSHELL: ${{ matrix.shell }}
        run: |
          & $env:POWERSHELL -NoProfile -ExecutionPolicy Bypass -File .\tests\run.ps1
          exit $LASTEXITCODE
