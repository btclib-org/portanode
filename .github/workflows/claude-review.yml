---
name: claude-review

# Claude reading a pull request against REVIEWING.md, and answering a
# comment naming @claude. The checkout, the credential guard, the
# prompt, the review action, the verdict check and the mention job are
# all btclib-org/.github's reusable-claude-review.yml, called at @main
# so a fix there reaches this tree in one landing (issue
# btclib-org/.github#35). What stays here is the trigger, the
# concurrency group, the workflow-level permissions and the paragraph
# this tree adds to the prompt, none of which the callee holds.
#
# What it is here for is the ack of record. Section 11 of the
# organization's standard says the author does not supply their own, and
# this repository has one maintainer -- so without this the only reading
# a pull request can get is the one its author wrote.
#
# Not a required check, and it must not become one. What it produces is a
# review of type COMMENT, an opinion for the author to weigh; a review
# that gated a merge would make a model's judgement a branch rule.
#
# REPOSITORY.md's main-self-merge rule counts one approving review before
# it lets a pull request merge; a review of type COMMENT does not supply
# that count, so this workflow is not a route to it -- fametrano bypasses
# the whole rule in pull_request mode regardless, being the only account
# that ever merges here. What holds a merge is Lint, the required status
# check REPOSITORY.md names, and this review stays outside it. What it
# buys instead is the reading a human weighs before pressing merge,
# chosen over a second human approving every pull request because
# nothing would land while nobody is available, and because the model is
# already the reviewer of record in substance.
#
# One calling job reaches both of the callee's jobs, and each of those
# declines the events that are not its own, so the job below carries no
# `if:` of the review's: the switch, the draft check, the closed check
# and the fork check are the callee's. A condition lifted up here would
# take the callee's `mention` job out with the review.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # draft condition in reusable-claude-review.yml withheld while it was
    # a draft: the default types do not include it, and without it a
    # readied pull request would wait for its next push to be reviewed at
    # all. The same reasoning links.yml carries for the same type.
    # closed too: the group below is at the workflow level, so a closed
    # run enters it when the run is created, before any job's own `if:`
    # is read, and can cancel a review still holding the group -- what
    # declines the actual review on a closed pull request is the
    # callee's own job-level `if:`, not this file's
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
# and nowhere else
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here. One key serves both halves of the workflow: a pull_request event
# keys on the pull request's number, so a push supersedes the review it
# overtakes, and every other event keys on github.run_id, which no two
# runs share, so an @claude answer neither cancels one nor is cancelled
# by one. The number alone would not do that, a
# pull_request_review_comment event carrying
# github.event.pull_request.number too and so landing a mention in the
# review's own group.
#
# At the workflow level rather than on the job, which is the placement
# btclib-org/btclib-secp256k1#593 settled: it is claimed when the run is
# created and before any job's own `if:` is read, so it is correct
# whether or not a job an `if:` skips claims a job-level group -- a
# question that issue closed without answering.
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Permissions are the calling job's to declare and not the callee's to
  # restore: a called workflow's own `permissions:` can only downgrade
  # what its caller granted. `contents: read` is what the checkout takes,
  # `pull-requests: write` is what posting the review or the reply takes,
  # and `id-token: write` is the OIDC token the action mints during its
  # own startup regardless of which Anthropic credential is in use --
  # btclib-org/.github#912 is where a caller omitting a scope a called
  # job declares was measured to end the run in `startup_failure` before
  # any step ran.
  #
  # secrets: named rather than `inherit`, the callee's own header
  # offering either: `inherit` hands the callee every secret this
  # repository holds, which is what zizmor's secrets-inherit audit flags.
  claude-review:
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write # posting the review, and the reply to a mention
      id-token: write # the OIDC token the action mints at its own startup
    with:
      # what a review of this tree has to know that a review of any
      # other tree does not, landing between the verdict paragraph and
      # the gates instruction
      extra-prompt: |
        What this repository ships is launchers and prose. Nothing
        here runs a launcher, so a change to one is verified by
        running it on the platform it is for, from a volume that is
        not the boot disk -- which no job does, this one included. A
        review that reasons about what a script would do says so in
        those words rather than reporting a trace as a run.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
