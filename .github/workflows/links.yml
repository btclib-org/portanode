---
name: links

# lychee over every markdown file this repository tracks. What a reader
# of these is being sent to is somebody else's release page, somebody
# else's signing key and somebody else's documentation, which is the
# whole of what a portable node installs; a destination that has moved is
# a user following an instruction to nowhere, and nothing else here looks.
#
# A workflow of its own rather than a job beside the lint one, because
# the two answer on different cadences and a job cannot. A link rots
# without anybody touching the tree, so asking per commit reports the
# internet's weather on somebody's prose branch, and a third party
# returning 502 or throttling a runner would turn a red merge into a
# thing to re-run rather than a thing to fix. Weekly, on demand, and red
# in the Actions tab is where this belongs -- which also keeps it out of
# main's required checks, where it must stay out: that rule lives outside
# the repository and names its checks as literal strings.

on:
  schedule:
    # The time is section 10's grid of btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "28 4 * * 6"
  # the escape hatch, and the way to check a branch before merging a
  # change that adds links: nothing else runs this on a pull request that
  # only edits prose, deliberately, per the header above
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures.
  # This runs more often than the paths list suggests: the filter is
  # evaluated against the pull request's whole diff against its base, not
  # against the push that triggered the run, so once a pull request
  # touches this file every later push to that branch runs it too
  pull_request:
    # ready_for_review so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it. closed too, though the job declines the
    # real work on it -- the same superseding lint.yml takes it for
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/links.yml

# least privilege for the GITHUB_TOKEN. lychee is handed it below for
# github.com links only, where an unauthenticated runner is rate limited
# hard enough to look like rot, and reading is all that takes.
# Deliberately not issues: write. An automatic "link rot" issue is the
# usual next step, and it would make this the only workflow here that can
# write anything, to save a maintainer from reading a failure
# notification they already get
permissions:
  contents: read

concurrency:
  # named literally rather than through github.workflow, and keyed on the
  # pull request's number for the reason lint.yml carries: two forks
  # whose head branches share a name share one head_ref group. A
  # scheduled or dispatched run has no number and falls back to
  # github.ref, which is refs/heads/main for both, so the weekly run and
  # a dispatch of it supersede each other -- wanted, since they ask the
  # same question of the same tree
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check the documentation links
    # a draft spends no runner, and a closed pull request spends none
    # either: the trigger above takes the closed event only to supersede
    # a run this ref's group is still holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # every link the tree holds, with retries; a job past this is hung on
    # one of them
    timeout-minutes: 15
    steps:
      # every action pinned to a commit SHA with the tag in the comment:
      # a tag, let alone a branch, is a name its owner can move
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lychee reads the tree and nothing pushes it back
          persist-credentials: false
      - name: Check the links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # the markdown and nothing else. The other URLs this tree
          # holds are in the update scripts, and they are endpoints those
          # scripts fetch rather than links a reader clicks -- what says
          # whether bitcoincore.org/bin and download.electrum.org still
          # answer is a run of the script, which holds what came back to
          # a signature and not merely to a status code.
          # The three globs are one set, and the third is not redundant
          # -- lychee's glob
          # does not match a leading dot, so `.claude/commands/review.md`
          # is reached by naming its directory and by nothing else. What
          # says the set is still the whole of the markdown:
          #
          #   diff <(git ls-files '*.md' | LC_ALL=C sort) \
          #        <(lychee --dump-inputs "*.md" "**/*.md" \
          #            ".claude/commands/*.md" | LC_ALL=C sort)
          #
          # --no-progress because the log is not a terminal. The retries,
          # the wait and a timeout well past lychee's default of 20
          # seconds are what keep a slow or throttling host from being
          # reported as a dead one, which is the one failure this
          # workflow must not produce: it gates nothing, so a false red
          # costs an investigation and buys nothing.
          # --accept is lychee's own default range with 429 added to it,
          # rather than a list of codes: `lychee --help` gives that
          # default as 100..=103,200..=299, so a "200,206,429" would
          # narrow it -- a 201 or a 204 becoming a dead link -- to add a
          # 206 the default already covers. 429 is the one code worth
          # adding, a rate limit being an answer from a host that is alive.
          # No --cache: a run starts from a fresh workspace, so the
          # cache file one run writes is read by the next only if a
          # step restores it, and none does; within one run lychee
          # asks each URL once whatever the flag says.
          # --include-fragments, or a heading renamed in the tree a
          # link here points into breaks that link with nothing red
          # anywhere: the forge serves the page and drops a fragment it
          # cannot resolve, so the run that notices is the linking
          # tree's. The check reads the page already fetched for the
          # link, so it adds no request. What can override it is the
          # token below: on a failed github.com/<owner>/<repo> link
          # lychee falls back to the repositories API, so a missing
          # fragment on that shape -- the one CONTRIBUTING.md cites the
          # standard by, and the only shape an anchor into another
          # repository of the organization takes here -- is read, found
          # missing, and then answered OK because the repository exists.
          # So what the flag buys here is the fragments of the other
          # hosts. btclib-org/.github#630 is where that is weighed.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 45
            --accept 100..=103,200..=299,429
            --include-fragments
            "*.md" "**/*.md" ".claude/commands/*.md"
          # fail the job rather than only summarizing: a green run that
          # found dead links is the state this workflow exists to end
          fail: true
        env:
          # for github.com links only, per the permissions comment above
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
