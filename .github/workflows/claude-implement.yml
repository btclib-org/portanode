---
name: claude-implement

# An issue taken as far as an open pull request by the Claude Code
# Action. The jobs, their scripts and bounds, and who starts a run are
# all btclib-org/.github's reusable-claude-implement.yml, whose header
# says what its caller holds; section 10 of the organization's standard
# has the rule. What stays here is the trigger, the permissions, the
# cache mode, the gates of this tree and the secret, passed by name,
# none of which the callee holds.
#
# Off until the organization variable CLAUDE_IMPLEMENT_ENABLED is
# `true`: the callee's agent jobs guard on it, and its other jobs run
# only after them. REPOSITORY.md's *Variables* reads it back.

# no `workflow_dispatch`, an exception to section 10's *`workflow_dispatch`
# on everything*, as claude-review.yml is: the event carries no issue, and
# the callee's `assess` job runs only on `issues`
on:
  issues:
    types: [opened, labeled, unlabeled]

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
# and nowhere else
permissions:
  contents: read

jobs:
  # The permissions are the ones the callee's jobs declare, for the
  # reason claude-review.yml's calling job gives, and the secret is
  # named rather than inherited for the same reason.
  claude-implement:
    # anybody can open an issue, and `none` keeps such a run from the
    # cache, which is what actionlint's cache-call-unrestricted asks for;
    # the callee has no cache step
    cache-mode: none
    uses: btclib-org/.github/.github/workflows/reusable-claude-implement.yml@cb5a79443399980ba717df2dea23dbedf6bdbc3a # v2026.11.12
    permissions:
      contents: read
      issues: write # the assessment's comment and the decision label
      id-token: write # the OIDC token the action mints at startup, and the one the callee's publish job trades for the App's token
    with:
      # CONTRIBUTING.md's *The environment and the gates*, one command
      # per line: the hooks, then the suite as macOS and Linux run it
      gates: |
        uvx pre-commit run --all-files
        uvx pre-commit run --all-files markdownlint-cli2
        uvx pre-commit validate-config .pre-commit-config.yaml
        bash tests/run.sh
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
