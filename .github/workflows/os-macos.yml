---
name: os-macos

# the macOS part of the platform sweep: the suite under tests/, under the
# /bin/bash a .command starts with. The gate, test.yml, runs one image for
# the reason its header gives; this answers weekly, and before a release,
# where RELEASING.md dispatches it. It gates no merge.

on:
  schedule:
    # the instant is section 10's calendar in btclib-org/.github, the day
    # and the hour the workflow's and the minute this repository's, and not
    # this file's to restate
    - cron: "28 5 * * 4"
  # the only way to ask about a branch, and how a release asks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Run the suite on macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the suite
        run: /bin/bash tests/run.sh
