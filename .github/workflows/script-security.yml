---
name: script-security

# the security rules of PSScriptAnalyzer and the Error, Security and
# Warning rules of Blinter, over every tracked .ps1 and .bat script: the
# hooks lint.yml runs read these files as text, and .pre-commit-config.yaml's
# header says why neither tool is a hook.
#
# A finding of any other rule does not fail the job. For PowerShell the
# rules are ScriptSecurity, the settings preset the module ships, and three
# security rules the preset leaves out: PSAvoidUsingInvokeExpression,
# PSAvoidUsingBrokenHashAlgorithms and
# PSAvoidUsingAllowUnencryptedAuthentication. A file PowerShell cannot
# parse fails too, since nothing in it was read. For batch a finding of
# those Blinter rules fails the job where the baseline below does not hold
# it, and the job fails as well where Blinter read a number of files other
# than the number git tracks, or where a tracked .bat or .cmd file holds a
# LINT:IGNORE directive, which would silence a finding without an entry in
# the baseline. Both tools' other rules stay by hand, as CONTRIBUTING.md's
# last section says.
#
# It fails too on a byte in those files that is neither printable ASCII nor
# ASCII whitespace, and on a CR not followed by LF. These two checks are
# the tree's own. They are not Blinter workarounds. Nothing else here
# refuses an invisible, bidirectional or look-alike character in a batch
# file, and cmd.exe reads a non-ASCII byte by the console code page. A lone
# CR escapes mixed-line-ending, which excludes .bat: cmd.exe drops it, while
# a reviewer's terminal or diff shows a line break that is not there.
#
# A Blinter finding that is no defect is accepted. .pre-commit-config.yaml's
# header says why for the Error and Security rules, and
# .github/blinter-reasons.md for the Warning rules, one section per rule.
# .github/blinter-baseline.json records each accepted finding by rule code,
# file and the text of the line, not its number, so an edit elsewhere in
# the file does not move it. .github/blinter.ini limits Blinter to those
# three severities.
# Blinter fails on a finding the baseline does not hold, and on an entry no
# finding matches. Blinter skips an entry whose file it did not read, so the
# job fails on an entry whose file git does not track as well. The file is
# kept equal to the findings of the tree it sits in, and the job prints the
# command that rewrites it.
#
# The job fails on a Warning rule the baseline accepts with no section in
# .github/blinter-reasons.md, and on a section for a rule the baseline does
# not accept. Blinter's report leaves out a finding the baseline holds,
# and the baseline records no severity, so the job reads each rule's
# severity from a second run without the baseline.
#
# Its job's name is a required context, which REPOSITORY.md's "What gates
# a merge" records.

on:
  push:
    branches: [main]
  pull_request:
    # closed for the reason lint.yml gives: the event joins this pull
    # request's concurrency group and cancels a run still in it
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: the job reads the checkout and
# writes nothing
permissions:
  contents: read

concurrency:
  # named literally and keyed as lint.yml's group is, for the reasons its
  # comment gives
  group: script-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  script-security:
    # the name is the context a required check names; lint.yml's job says
    # why renaming it cannot be done in a pull request once a rule names it
    name: Script security
    # a draft and a closed pull request decline as lint.yml's jobs do
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # two downloads and two analyses: a job past this is hung
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # caching off: the install below is two wheels
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # blinter and its one dependency, each pinned to the hash of the wheel
      # PyPI serves. uvx would take the version and ignore a hash, so the
      # install goes into a venv of its own. The Python range is blinter's
      # requires-python
      - name: Install Blinter
        run: |
          printf '%s --hash=sha256:%s\n' \
            blinter==1.1.47 \
            5fede89916e331d5dd2287b65cd08a5b1205495ff279aee872149d5ff9f1e64e \
            charset-normalizer==3.5.2 \
            b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685 \
            > "$RUNNER_TEMP/blinter-requirements.txt"
          uv venv --quiet --python '>=3.11,<3.16' "$RUNNER_TEMP/blinter"
          uv pip install --quiet --python "$RUNNER_TEMP/blinter" \
            --require-hashes --only-binary :all: \
            --requirement "$RUNNER_TEMP/blinter-requirements.txt"

      # blinter exits non-zero on a finding of the rules .github/blinter.ini
      # runs that the baseline does not hold, and on a baseline entry no
      # finding matches. What says it ran is its count of the files it read,
      # set against the files git tracks. It leaves alone an entry whose
      # file it did not read, so the entries' files are set against git's
      # too. The accepted rules are then set against the reasons file's
      # sections, as the header says
      - name: Check the .bat scripts with the Blinter rules .github/blinter.ini runs
        run: |
          set -o pipefail
          t="$RUNNER_TEMP"
          rc=0
          LC_ALL=C git grep -n -E -e '[^[:print:][:space:]]' -e $'\r.' \
            -- '*.bat' '*.cmd' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::a byte neither printable ASCII nor whitespace, or a CR without LF"
            exit 1
          elif [ "$rc" -ne 1 ]; then
            exit "$rc"
          fi
          rc=0
          git grep -n -i 'LINT:IGNORE' -- '*.bat' '*.cmd' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::a LINT:IGNORE directive; .github/blinter-baseline.json holds exceptions"
            exit 1
          elif [ "$rc" -ne 1 ]; then
            exit "$rc"
          fi
          rc=0
          "$t/blinter/bin/blinter" . --config .github/blinter.ini \
            --baseline .github/blinter-baseline.json \
            --format json --output "$t/blinter.json" || rc=$?
          tracked=$(git ls-files '*.bat' '*.cmd' | wc -l)
          processed=$(jq '.summary.files_processed' "$t/blinter.json")
          if ! [ "$processed" -eq "$tracked" ]; then
            echo "::error::blinter read $processed files where git tracks $tracked"
            exit 1
          fi
          jq -r '.[].file | sub("^\\.\\./"; "")' .github/blinter-baseline.json |
            LC_ALL=C sort -u > "$t/listed"
          git ls-files '*.bat' '*.cmd' | LC_ALL=C sort > "$t/tracked"
          LC_ALL=C comm -23 "$t/listed" "$t/tracked" > "$t/gone"
          if [ -s "$t/gone" ]; then
            echo "::error::baseline entries for files git does not track"
            cat "$t/gone"
            echo "remove them from .github/blinter-baseline.json"
            exit 1
          fi
          jq -r '.summary
            | "\(.baselined_issues) findings in the baseline, in \(.files_processed) files"' \
            "$t/blinter.json"
          if [ "$rc" -ne 0 ]; then
            echo "::error::findings the baseline does not hold, or entries no finding matches"
            jq -r '.issues[] | "\(.file):\(.line): \(.code) \(.name)"' "$t/blinter.json"
            jq -r '.stale_baseline_entries[]
              | "no finding: \(.code) \(.file): \(.text)"' "$t/blinter.json"
            echo "to accept them, run the pinned blinter in the repository root:"
            echo "  blinter . --config .github/blinter.ini \\"
            echo "    --baseline .github/blinter-baseline.json --update-baseline"
            exit 1
          fi
          "$t/blinter/bin/blinter" . --config .github/blinter.ini \
            --fail-on none --format json --output "$t/unbaselined.json"
          jq -r '.issues[] | select(.severity == "Warning") | .code' \
            "$t/unbaselined.json" | LC_ALL=C sort -u > "$t/warning"
          jq -r '.[].code' .github/blinter-baseline.json |
            LC_ALL=C sort -u > "$t/accepted"
          sed -n -E 's/^## ([A-Z]+[0-9]+)( .*)?$/\1/p' .github/blinter-reasons.md |
            LC_ALL=C sort -u > "$t/reasoned"
          LC_ALL=C comm -12 "$t/warning" "$t/accepted" |
            LC_ALL=C comm -23 - "$t/reasoned" > "$t/unreasoned"
          LC_ALL=C comm -23 "$t/reasoned" "$t/accepted" > "$t/unaccepted"
          if [ -s "$t/unreasoned" ] || [ -s "$t/unaccepted" ]; then
            echo "::error::.github/blinter-reasons.md and the baseline name different rules"
            sed 's/$/: accepted, with no section/' "$t/unreasoned"
            sed 's/$/: a section, with no accepted finding/' "$t/unaccepted"
            exit 1
          fi
          echo "a section in .github/blinter-reasons.md for each accepted Warning rule:"
          LC_ALL=C comm -12 "$t/warning" "$t/accepted" | paste -s -d ' ' -

      # the module as its release publishes it, pinned to the hash of the
      # package. pwsh is the runner's own
      - name: Install PSScriptAnalyzer
        run: |
          pkg="$RUNNER_TEMP/PSScriptAnalyzer.nupkg"
          curl --fail --silent --show-error --location --output "$pkg" \
            https://github.com/PowerShell/PSScriptAnalyzer/releases/download/1.25.0/PSScriptAnalyzer.1.25.0.nupkg
          echo "14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60  $pkg" |
            sha256sum --check --strict
          unzip -q "$pkg" -d "$RUNNER_TEMP/PSScriptAnalyzer"

      # one file at a time, from git's list, so that every tracked script is
      # read and a parse error names its file
      - name: Check the .ps1 scripts with PSScriptAnalyzer's security rules
        shell: pwsh
        run: |
          Import-Module "$env:RUNNER_TEMP/PSScriptAnalyzer/PSScriptAnalyzer.psd1"
          $module = Get-Module PSScriptAnalyzer
          $version = $module.Version
          # the preset read from the module, so its list stays the module's,
          # with the header's three rules added
          $settings = Import-PowerShellDataFile `
            (Join-Path $module.ModuleBase 'Settings/ScriptSecurity.psd1')
          $settings.IncludeRules += @(
            'PSAvoidUsingInvokeExpression'
            'PSAvoidUsingBrokenHashAlgorithms'
            'PSAvoidUsingAllowUnencryptedAuthentication'
          )
          "PowerShell $($PSVersionTable.PSVersion), PSScriptAnalyzer $version"
          $files = @(git ls-files '*.ps1' '*.psm1' '*.psd1')
          $found = @(foreach ($f in $files) {
            Invoke-ScriptAnalyzer -Path $f -Settings $settings |
              ForEach-Object { "::error file=$f,line=$($_.Line)::$($_.RuleName): $($_.Message)" }
          })
          "$($found.Count) security findings in $($files.Count) files"
          $found
          if ($found.Count -gt 0) { exit 1 }
