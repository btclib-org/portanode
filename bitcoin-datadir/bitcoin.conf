# [core]
# Enable all compact filters.
blockfilterindex=1
# Maintain coinstats index used by the gettxoutsetinfo RPC.
coinstatsindex=1
# Maintain a full transaction index, used by the getrawtransaction rpc call.
txindex=1

# [network]
# Serve compact block filters to peers per BIP 157.
# NOTE: enabling this will force blockfilterindex on
peerblockfilters=1

# [rpc]
# server=1 is not set here. bitcoind turns it on by itself, which is what
# the regtest -cli launchers run; bitcoin-qt does not, and without it no
# RPC port is opened and no .cookie is written to this directory. Set it
# under the section of a network, never above the first section, and only
# for a client that needs it (bitcoin-cli against a Qt node, or an Electrum
# server such as the one mainnet-local-server-only connects to). On exFAT
# the .cookie cannot be protected from other accounts.

# [secrets]
# Keep rpcpassword, rpcauth and every other local secret out of this
# tracked file, in bitcoin.local.conf next to it: git ignores that name
# (bitcoin-datadir/.gitignore denies everything it does not list).
# Bitcoin Core refuses to start when an includeconf file is missing, so
# create the file first (an empty one is enough), then remove the "#":
#includeconf=bitcoin.local.conf

# [Sections]
# Most options automatically apply to mainnet, testnet, and regtest networks.
# If you want to confine an option to just one network,
# you should add it in the relevant section.
# EXCEPTIONS: addnode, connect, port, bind, rpcport, rpcbind and wallet
# only apply to mainnet unless they appear in the appropriate section below.

# Options only for mainnet
[main]

# Set database cache size in megabytes;
# machines sync faster with a larger cache.
dbcache=4096

# Keep the transaction memory pool below <n> megabytes.
maxmempool=4096

# Do not keep transactions in the mempool longer than <n> hours.
mempoolexpiry=5124

# Options only for testnet
[test]

# Set database cache size in megabytes;
# machines sync faster with a larger cache.
dbcache=4096

# [network]
# Relay and mine non-standard transactions (testnet/regtest only.)
acceptnonstdtxn=1

# Options only for testnet4
[testnet4]

# Set database cache size in megabytes;
# machines sync faster with a larger cache.
dbcache=4096

# [network]
# Relay and mine non-standard transactions (testnet/regtest only.)
acceptnonstdtxn=1

# Options only for regtest
[regtest]

# [network]
# Relay and mine non-standard transactions (testnet/regtest only.)
acceptnonstdtxn=1
