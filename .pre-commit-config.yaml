---
# the lint gate of this repository. What it ships is launcher scripts and
# prose, so the hooks below are the ones with a subject here: the
# markdown, the yaml of the workflows and of the issue forms, the json,
# the toml this file's own spell-checker configuration is written in, and
# the text every file is made of.
#
# What is absent is absent for a measured reason rather than an
# oversight. `git ls-files '*.py'` is empty, so ruff and mypy have no
# file to read and `check-hooks-apply` below would fail on each; there is
# no project and no `uv.lock`, so `uv-lock` has nothing to keep in step.
# A hook is added here the day the tree grows the file it reads.
#
# Skip a hook with SKIP=<id>, or all of them with "git commit -n".
ci:
  # a bot committing to a branch is at odds with a setup where no
  # workflow token can write: a failing hook is fixed by its author
  autofix_prs: false
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly

repos:
  # this file checking itself, and the only two hooks with no environment
  # to install: a pattern that has stopped matching is a rule that has
  # quietly stopped running
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # and checking the two moves "autoupdate" must not make: a rev naming
  # only a major follows every future release of it, and a prerelease is
  # not a release. pre-commit says the first half itself, on stderr, on a
  # run that then exits zero -- which is the difference between a warning
  # and a gate. A commit SHA stays acceptable: forty hex characters do not
  # end in a prerelease marker
  - repo: local
    hooks:
      - id: pinned-rev
        name: every pre-commit rev names a released version
        language: pygrep
        entry: '^ *rev: "?v?([0-9]+|[0-9][0-9.]*(a|b|rc|dev)[0-9]+)"?$'
        files: ^\.pre-commit-config\.yaml$
  # the executable half of the tree: identify reads a shebang on an
  # executable file, so .command launchers are typed "shell" here the same
  # as .sh, and nothing further is needed to reach both. -x follows a
  # sourced file that is not itself among the files being checked, which
  # every launcher needs for lib.sh; each source line carries its own
  # "shellcheck source=" so -x knows where to look rather than guessing
  # from the dynamic $SCRIPT_DIR path shellcheck cannot evaluate. The two
  # findings shellcheck is wrong about -- a deliberate unquoted expansion
  # tar needs word-split and a line continuation that is not accidental
  # concatenation -- are disabled at their own line in update-bitcoin.sh,
  # with the reasoning beside them, rather than here: a global disable
  # would silence a real instance of either alongside the false one.
  # Pinned to the shellcheck-py version already used below as actionlint's
  # additional_dependency, so one shellcheck runs across the tree.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        # the Windows launchers, which .gitattributes checks out as
        # "text eol=crlf" because cmd.exe reads a .bat line by line and a
        # lone LF has cost that reader a label before now. Left in this
        # hook's reach the two fight each other: the fixer rewrites the
        # working tree to LF, git checks it out as CRLF again, and the
        # hook reports a fix on every run -- a gate that never closes,
        # with no diff to show for it, git comparing the normalized index
        # rather than the file. trailing-whitespace and end-of-file-fixer
        # above need no such exclusion: both preserve the line ending
        # they find, which is why only this one is named
        exclude: \.bat$
      # CLAUDE.md's own invariant: the executable bit is set on what macOS
      # runs -- the root and macos/scripts/ .command and .sh launchers --
      # and on nothing else. The two lib.sh are excluded because they are
      # sourced rather than run, and a bit on either would say a thing
      # about the file that running it does not bear out; the .bat and
      # .ps1 halves carry no shebang and so never reach this hook. Windows
      # does not store the git file mode at all, so a bit lost on that
      # platform is invisible to it there and caught here on whichever
      # platform commits
      - id: check-shebang-scripts-are-executable
        exclude: ^macos/scripts/(lib\.sh|utilities/lib\.sh)$
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      # the hand-written json -- .claude/settings.json, which is what
      # `git ls-files '*.json'` answers: section 4 of the standard lists
      # this hook with the syntax ones, and check-json above asks only
      # whether the file parses. Not prettier's, whose list below is yaml
      # and jsonc: one formatter per file, or the two rewrite each other
      - id: pretty-format-json
        name: pretty-format-json (in place fixes)
        args: [--autofix]
      # the toml here is read by taplo every run, but a format is not a
      # parse: taplo rewrites what it can read and says nothing the gate
      # hears about what it cannot, and typos refusing .typos.toml is the
      # next thing that would, at the point where typos was being run for
      # another reason. Section 4 puts the question in the gate
      - id: check-toml
      - id: check-added-large-files
      # there are none, and a submodule is the one dependency that would
      # be pinned by nothing here
      - id: forbid-submodules
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (in place fixes)
        # identifiers rather than misspellings, and the same two
        # .typos.toml carries: `fpr` is gpg's own --with-colons record
        # name for a fingerprint, which the verification helpers read and
        # name their variables after, and `bre` is the POSIX basic
        # regular expressions the macOS grep comments are about. Written
        # here rather than in a file of their own because codespell takes
        # a flag for it where typos takes none
        args: [--write-changes, -L, "fpr,bre"]
  # a release tag, not the `v1` beside it: that one is a major-version
  # alias upstream moves onto each release, so `pre-commit autoupdate`
  # picks it as the newest tag and the pin stops being one
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      # in place fixes already, by upstream's own .pre-commit-hooks.yaml:
      # args: [--write-changes, --force-exclude], inherited because this
      # file passes no args: of its own. An args: added here later for a
      # different reason would silently drop that default and turn the
      # fixing off
      - id: typos
  # the credentials of other systems, which is the half of secret
  # scanning GitHub's free plan does not cover: partner and provider
  # tokens are scanned server-side, the generic patterns (PEM keys,
  # connection strings, authentication headers) belong to Secret
  # Protection, and the API accepts that setting with a 200 and leaves it
  # disabled. detect-private-key above covers the PEM case, and a wallet
  # is what this tree starts, so a key pasted into a launcher while
  # debugging one is the accident worth a hook.
  # Not gitleaks: all of its hook ids invoke it with --staged, so under
  # "pre-commit run --all-files" it scans an empty staged set and passes
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credentials of other systems)
        # against a committed baseline rather than an exclusion: a
        # finding recorded there is one somebody has read, where an
        # excluded file is unwatched from then on. `keys/*.fingerprints`
        # and `*/checksums.sha256` are the hex this tree carries, and
        # `detect-secrets scan` with every plugin at its default,
        # HexHighEntropyString included, answers with no finding
        # anywhere in the tree -- unlike a sibling whose genesis-block
        # constants needed that plugin off, nothing here is close enough
        # to that threshold to need the same exception
        args: [--baseline, .secrets.baseline]
  # MD013 at 80 columns, tables included, and the shared configuration is
  # the one every repository of the organization carries: prose moves
  # between them, and a paragraph that lints in one has to lint here
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (in place fixes)
        args: [--fix]
  # how a link destination is spelled, which markdownlint has no rule
  # for. Section 4 of the organization's standard is the rule, why the
  # prefix and not the extension, and what this cannot see; there is no
  # shared hook repository to write it in once, so it is the same hook in
  # each repository, `pinned-rev` above being that arrangement already
  - repo: local
    hooks:
      - id: local-link-prefix
        name: a local markdown link destination begins with ./
        language: pygrep
        # one line, and no literal space in it -- "\x20" is the space the
        # reference branch allows -- so yamllint reads the value as a
        # single unbreakable word and its 100-column rule exempts it. A
        # block scalar rather than a quoted one for the same reason a
        # folded scalar was rejected: folding joins lines with a space,
        # which would land inside the regex
        entry: |-
          (?<![`!\[])(?:!?\[(?:[^]]|\]\([^)]*\))*\]\(|^\x20{0,3}\[[^]]+\]:\s*)(?!\./|#|[A-Za-z][A-Za-z0-9+.-]*:)[^)\s]
        types: [markdown]
      # a line that ends inside a word, at that word's own hyphen.
      # Section 4 of the organization's standard is the rule: what such a
      # line renders as, why nothing else here catches it, and what this
      # pattern cannot see
      - id: no-hyphen-at-end-of-line
        name: a word is not wrapped at its own hyphen
        language: pygrep
        entry: "[A-Za-z0-9]-$"
        types: [markdown]
      # how the operating system is spelled, which neither spell-checker
      # reads as a misspelling: to `typos` and to `codespell` a known word
      # in another case is a known word, so a capital M and a small final
      # letter passed both of them.
      #
      # Two spellings are allowed and every other case is refused. `macOS`
      # is Apple's and is what prose uses; the all-lower-case one is the
      # directory of this tree and the value `update-electrum.sh` gives
      # `OS`, so refusing it would be refusing a path.
      #
      # `Contents/` before the token is the one exception, that being
      # Apple's own bundle layout rather than a spelling anybody chose.
      # Without the lookbehind the hook answers with every launcher and
      # every checksum line; the alternative, restricting it to markdown,
      # would leave a comment in a script unread.
      # An identifier needs no exception: `ELECTRUM_MACOS` has no word
      # boundary before the token, `_` being a word character.
      #
      # This comment is in the hook's own reach, which is why it describes
      # the refused forms instead of writing them
      - id: macos-is-spelled-macos
        name: macOS is spelled the way Apple spells it
        language: pygrep
        entry: '(?<!Contents/)\b(?!macOS\b)(?!macos\b)[Mm][Aa][Cc][Oo][Ss]\b'
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: prettier (yaml and jsonc, in place fixes)
        # named by path rather than by type: `jsonc` is not a tag identify
        # knows, so a types_or entry for it fails the config outright
        files: ^(.*\.ya?ml|\.markdownlint\.jsonc)$
  # the toml here is configuration and nothing else: .taplo.toml, which
  # carries the formatting choices and the reasoning, and .typos.toml,
  # which the hook above has no flag for. One indent for every toml in
  # the organization is the point of having a formatter at all. Naming
  # them here is what .taplo.toml asks of the repository that carries it,
  # that file being shared and so unable to say which toml any one tree
  # holds; git ls-files '*.toml' is what says whether this comment has
  # gone stale
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: taplo (toml, in place fixes)
  # check-only: yamllint has no fix mode, and its own README names none
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  # .github/dependabot.yml is validated by nothing else here: check-yaml
  # above asks whether it is yaml, and actionlint below reads workflows
  # and not this. A typo in a package-ecosystem or a directory is not an
  # error to GitHub -- it silently updates nothing, and the evidence is a
  # pull request that never arrives, which on a repository whose only
  # ecosystem is the action pins means every pin frozen with nothing
  # saying so.
  # check-github-workflows is not added beside it: actionlint already
  # reads every workflow and goes further than the schema does, into
  # expressions, contexts and runner labels
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot
  # the workflows carry expressions and logic no schema reads: an unknown
  # key, a typo in a context reference, an action input that does not
  # exist, a job depending on a job that is not there are all things a
  # run discovers by failing.
  # The Python packaging of actionlint rather than the upstream hook,
  # whose only non-docker id is language: golang, i.e. a go toolchain on
  # every machine that commits and on pre-commit.ci
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        name: actionlint (github workflows)
        # actionlint delegates the body of a run: step to shellcheck if
        # it finds one on the PATH, and without it validates the yaml
        # around a shell script rather than the script. That is a
        # different subject from the shellcheck this file's header argues
        # about: this one reads the few lines a workflow inlines, where
        # the header is about the launchers under macos/scripts, which no
        # hook here reads yet.
        # Declared rather than left to the machine, so that a commit and
        # CI check the same thing -- the runner image happens to carry
        # shellcheck, so leaving it to chance means CI checking more than
        # a commit does. Pinned, unlike a rev, because nothing bumps an
        # additional dependency: pre-commit.ci moves rev, dependabot has
        # no pre-commit ecosystem. That is the point rather than the cost
        # -- a shellcheck release adding a check would otherwise turn a
        # pull request red for having changed nothing
        additional_dependencies:
          - shellcheck-py==0.11.0.1
  # actionlint asks whether a workflow is correct, zizmor whether it is
  # safe: a token persisted where a later step can read it, an expression
  # interpolated into a shell script, a trigger that runs a fork's code
  # with write access. The last of those is what this repository has to
  # get right -- claude-review.yml holds a credential -- and it is the
  # one an author is least able to see by reading.
  # The default persona is the gate; --persona=auditor adds advice, none
  # of it a defect, and is worth running by hand rather than on every
  # commit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        # offline is what it does by default, said out loud: it warns
        # about the implicit choice on every run, and the choice is the
        # right one. Two audits can query GitHub for the actions a
        # workflow pins -- impostor-commit and known-vulnerable-actions
        # -- which would make the hook want a token and report
        # differently on a machine that has none. Those two therefore
        # stay unrun, here and in CI.
        # --no-progress is repeated rather than added: args replaces what
        # the hook declares, and that flag is the whole of what it
        # declares, so passing --offline alone would drop it
        args: [--offline, --no-progress]
